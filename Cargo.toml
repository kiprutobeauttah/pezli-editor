[package]
name = "pezli-editor"
version = "1.0.0"
edition = "2021"
description = "A native desktop text editor built with Rust and egui"

[workspace]

[dependencies]
eframe = "0.35"
egui = "0.35"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
ureq = { version = "3.1", features = ["json"] }

[profile.release]
opt-level = 2
