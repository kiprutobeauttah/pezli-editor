[package]
name = "pezli-editor"
version = "1.0.0"
description = "Pezli Editor - a lightweight desktop text editor"
authors = ["Beauttah Kipruto"]
edition = "2021"
rust-version = "1.77.2"

[workspace]

[lib]
name = "pezli_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
