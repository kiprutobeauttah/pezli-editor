<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pezli Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="title-left">
          <span class="app-logo">P</span>
          <nav id="menubar">
            <div class="menu">
              <button class="menu-trigger">File</button>
              <div class="menu-dropdown">
                <button class="menu-item" data-action="new"><span class="mi" data-icon="file-plus"></span>New<span class="key">Ctrl+N</span></button>
                <button class="menu-item" data-action="open"><span class="mi" data-icon="file"></span>Open File...<span class="key">Ctrl+O</span></button>
                <button class="menu-item" data-action="openFolder"><span class="mi" data-icon="folder"></span>Open Folder...<span class="key">Ctrl+Shift+O</span></button>
                <button class="menu-item" data-action="addFolder"><span class="mi" data-icon="folder-plus"></span>Add Folder to Workspace...</button>
                <div class="sep"></div>
                <button class="menu-item" data-action="share"><span class="mi" data-icon="share-2"></span>Copy All<span class="key">Ctrl+Shift+C</span></button>
                <div class="sep"></div>
                <button class="menu-item" data-action="save"><span class="mi" data-icon="save"></span>Save<span class="key">Ctrl+S</span></button>
                <button class="menu-item" data-action="saveas"><span class="mi" data-icon="download"></span>Save As...<span class="key">Ctrl+Shift+S</span></button>
                <div class="sep"></div>
                <button class="menu-item" data-action="exit"><span class="mi" data-icon="log-out"></span>Exit<span class="key">Ctrl+Q</span></button>
                <div class="sep"></div>
                <button class="menu-item" data-action="settings"><span class="mi" data-icon="settings"></span>Settings<span class="key">Ctrl+,</span></button>
              </div>
            </div>
            <div class="menu">
              <button class="menu-trigger">Edit</button>
              <div class="menu-dropdown">
                <button class="menu-item" data-action="undo"><span class="mi" data-icon="rotate-ccw"></span>Undo<span class="key">Ctrl+Z</span></button>
                <button class="menu-item" data-action="redo"><span class="mi" data-icon="rotate-cw"></span>Redo<span class="key">Ctrl+Y</span></button>
                <div class="sep"></div>
                <button class="menu-item" data-action="cut"><span class="mi" data-icon="scissors"></span>Cut<span class="key">Ctrl+X</span></button>
                <button class="menu-item" data-action="copy"><span class="mi" data-icon="copy"></span>Copy<span class="key">Ctrl+C</span></button>
                <button class="menu-item" data-action="paste"><span class="mi" data-icon="clipboard"></span>Paste<span class="key">Ctrl+V</span></button>
                <button class="menu-item" data-action="selectall"><span class="mi" data-icon="check"></span>Select All<span class="key">Ctrl+A</span></button>
                <div class="sep"></div>
                <button class="menu-item" data-action="find"><span class="mi" data-icon="search"></span>Find<span class="key">Ctrl+F</span></button>
                <button class="menu-item" data-action="replace"><span class="mi" data-icon="refresh-cw"></span>Replace<span class="key">Ctrl+H</span></button>
              </div>
            </div>
            <div class="menu">
              <button class="menu-trigger">View</button>
              <div class="menu-dropdown">
                <button class="menu-item" data-action="toggleSide"><span class="mi" data-icon="sidebar"></span>Toggle Side Bar<span class="key">Ctrl+B</span></button>
                <button class="menu-item" data-action="togglePanel"><span class="mi" data-icon="columns"></span>Toggle Panel<span class="key">Ctrl+`</span></button>
                <button class="menu-item" data-layout="side-right"><span class="mi" data-icon="move"></span>Move Side Bar Right</button>
                <button class="menu-item" data-layout="side-left"><span class="mi" data-icon="move"></span>Move Side Bar Left</button>
                <button class="menu-item" data-layout="panel-right"><span class="mi" data-icon="move"></span>Move Panel Right</button>
                <button class="menu-item" data-layout="panel-bottom"><span class="mi" data-icon="move"></span>Move Panel Bottom</button>
                <div class="sep"></div>
                <button class="menu-item" data-action="theme"><span class="mi" data-icon="droplet"></span>Switch Theme<span class="key">Ctrl+T</span></button>
                <button class="menu-item" data-action="zoomin"><span class="mi" data-icon="zoom-in"></span>Zoom In<span class="key">Ctrl++</span></button>
                <button class="menu-item" data-action="zoomout"><span class="mi" data-icon="zoom-out"></span>Zoom Out<span class="key">Ctrl+-</span></button>
              </div>
            </div>
            <div class="menu">
              <button class="menu-trigger">Help</button>
              <div class="menu-dropdown">
                <button class="menu-item" data-action="shortcuts"><span class="mi" data-icon="layout"></span>Keyboard Shortcuts</button>
                <button class="menu-item" data-action="developer"><span class="mi" data-icon="user"></span>Developer Info</button>
                <button class="menu-item" data-action="about"><span class="mi" data-icon="info"></span>About</button>
              </div>
            </div>
          </nav>
        </div>
        <div id="title-file">Pezli Editor</div>
        <div class="title-right">
          <span class="dev-chip"><span class="dev-avatar">BK</span><span>Beauttah Kipruto</span></span>
          <button class="icon-btn" data-action="theme" data-icon="droplet" title="Switch Theme (Ctrl+T)"></button>
          <button class="icon-btn" data-action="zoomin" data-icon="zoom-in" title="Zoom In"></button>
          <button class="icon-btn" data-action="zoomout" data-icon="zoom-out" title="Zoom Out"></button>
        </div>
      </header>

      <div id="workspace">
        <aside id="activityBar" draggable="true" title="Drag to move this bar">
          <button class="activity" data-view="explorer" data-icon="layers" title="Explorer"></button>
          <button class="activity" data-view="search" data-icon="search" title="Search"></button>
          <button class="activity" data-view="source" data-icon="git-branch" title="Source Control"></button>
          <div class="activity-spacer"></div>
          <button class="activity" data-action="layoutMenu" data-icon="layout" title="Layout"></button>
          <button class="activity" data-action="settings" data-icon="settings" title="Settings"></button>
          <button class="activity" data-action="about" data-icon="help-circle" title="Help"></button>
        </aside>

        <aside id="sideBar">
          <div class="zone-header">
            <span id="sideTitle">EXPLORER</span>
            <button class="mini-btn" data-action="toggleSide" data-icon="x" title="Hide Side Bar"></button>
          </div>
          <div id="sideBody"></div>
        </aside>

        <div id="sideSplitter" class="splitter vertical"></div>

        <div id="center">
          <div id="editorZone">
            <div id="tabs"></div>
            <div id="editor" class="editor" spellcheck="false"></div>
          </div>
        </div>

        <div id="panelSplitter" class="splitter horizontal"></div>

        <section id="panel">
          <div id="panelHeader" draggable="true" title="Drag to dock the panel">
            <div id="panelTabs">
              <button class="panel-tab active" data-panel="problems">PROBLEMS</button>
              <button class="panel-tab" data-panel="output">OUTPUT</button>
              <button class="panel-tab" data-panel="search">SEARCH</button>
            </div>
            <div class="panel-actions">
              <button class="mini-btn" data-action="panelMenu" data-icon="more-horizontal" title="Panel layout"></button>
              <button class="mini-btn" data-action="togglePanel" data-icon="x" title="Close Panel"></button>
            </div>
          </div>
          <div id="panelBody"></div>
        </section>
      </div>

      <footer id="statusbar">
        <button class="status-item" data-action="toggleSide" data-icon="sidebar" title="Toggle Side Bar"></button>
        <button class="status-item" data-action="togglePanel" data-icon="columns" title="Toggle Panel"></button>
        <span class="status-sep"></span>
        <span id="status-cursor">Ln 1, Col 1</span>
        <span id="status-selection"></span>
        <span id="status-find"></span>
        <span class="spacer"></span>
        <span id="status-font">Spaces: 4 &nbsp; UTF-8 &nbsp; LF</span>
        <span id="status-theme">Light Theme</span>
      </footer>
    </div>

    <div id="contextMenu"></div>
    <div id="modalRoot"></div>
    <div id="snackbar" role="status" aria-live="polite"></div>

    <script src="vendor/feather.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
